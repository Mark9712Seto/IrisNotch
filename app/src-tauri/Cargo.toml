[package]
name = "iris-volto"
version = "0.2.2"
description = "Il volto di Iris: isola in cima allo schermo per parlare con Hermes"
edition = "2021"
license = "MIT"

[lib]
name = "iris_volto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native", "linux-native", "apple-native"] }
cpal = "0.15"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"

# trascrizione locale: su Windows con accelerazione Vulkan (va su qualunque scheda video con driver recenti, senza CUDA)
[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"] }
# spostare la finestra con una sola chiamata e leggere il tasto del mouse durante il trascinamento
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(not(windows))'.dependencies]
whisper-rs = { version = "0.16" }

[profile.release]
opt-level = 3
lto = "thin"
