name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Pubblica una Release con la versione di tauri.conf.json"
        type: boolean
        default: false

# per pubblicare una versione: si alza il numero in app/src-tauri/tauri.conf.json e Cargo.toml,
# poi si avvia questa build a mano con "release" acceso (oppure si crea il tag, es. v0.2.0):
# l'installer viene allegato a una Release di GitHub.
# L'app controlla solo le Release (non i singoli commit) e avvisa che c'è una versione nuova.
permissions:
  contents: write
  id-token: write      # attestazione di provenienza (repo pubblico)
  attestations: write

jobs:
  # test del lato Rust su Linux, compresa la prova completa contro il finto Hermes
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev cmake clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Test
        run: |
          python3 ../../tools/mock_hermes.py 8642 &
          sleep 1
          MOCK_HERMES=http://127.0.0.1:8642 cargo test -- --include-ignored

  # programma per Windows: installer (.exe NSIS) e programma da solo
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # whisper.cpp + Vulkan crea percorsi molto profondi: con la cartella di default si supera il limite
      # di 260 caratteri di Windows (errore FTK1011). Una cartella dal nome corto lo evita.
      CARGO_TARGET_DIR: C:\t
      VT_API_KEY: ${{ secrets.VT_API_KEY || secrets.VIRUSTOTAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> C:\t
      # whisper.cpp con Vulkan: servono gli header e il compilatore di shader (glslc) del Vulkan SDK
      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Iris-Notch-Windows
          path: |
            C:/t/release/bundle/nsis/*.exe
            C:/t/release/iris-volto.exe
          if-no-files-found: error
      - name: Release (solo per i tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: C:/t/release/bundle/nsis/*.exe
          generate_release_notes: true
      # attestazione di GitHub: prova che l'installer è stato compilato da questo workflow, da questo codice
      # (si verifica con: gh attestation verify <file.exe> --repo <proprietario/repo>). Solo per i repo pubblici.
      - name: Attestazione di provenienza
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: C:/t/release/bundle/nsis/*.exe
      # VirusTotal, se nel repo c'è il segreto VT_API_KEY (o VIRUSTOTAL) (account gratuito su virustotal.com → API key)
      - name: VirusTotal
        id: vt
        if: env.VT_API_KEY != ''
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY || secrets.VIRUSTOTAL }}
          files: C:/t/release/bundle/nsis/*.exe
      - name: Release (avviata a mano)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VT_ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          V="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          EXE=$(ls C:/t/release/bundle/nsis/*.exe | head -1)
          SHA=$(sha256sum "$EXE" | cut -d' ' -f1)
          PRE=""; case "$V" in v0.*) PRE="--prerelease";; esac
          {
            echo "## Iris Notch $V"
            echo
            echo "Early version: some bugs are still there. / Versione iniziale: qualche bug c'è ancora."
            echo
            echo "**Install / Installare:** download \`$(basename "$EXE")\` below and run it. SmartScreen will warn you because the app isn't code-signed yet: *More info → Run anyway*. Guide: [English](https://github.com/${{ github.repository }}/blob/main/docs/install.md) · [Italiano](https://github.com/${{ github.repository }}/blob/main/docs/installazione.md)."
            echo
            echo "### Check the file / Controllare il file"
            echo
            echo "- SHA-256: \`$SHA\`"
            echo "  (PowerShell: \`Get-FileHash \".\\$(basename "$EXE")\"\`)"
            if [ "${{ github.event.repository.visibility }}" = "public" ]; then
              echo "- Built by GitHub Actions from this repository, with a signed build provenance attestation: \`gh attestation verify \"$(basename "$EXE")\" --repo ${{ github.repository }}\`"
            fi
            # il link solo se il file è stato davvero caricato su VirusTotal (altrimenti la pagina è vuota)
            if [ -n "$VT_ANALYSIS" ]; then
              echo "- VirusTotal: https://www.virustotal.com/gui/file/$SHA"
            fi
            echo
            if [ -f ../CHANGELOG.md ]; then
              # la sezione di questa versione dal CHANGELOG (inglese e italiano)
              awk -v v="$V" '$0 ~ "^#+ "v" " {on=1; next} /^#+ v[0-9]/ {on=0} /^## Italiano/ {on=0} on' ../CHANGELOG.md
            fi
            echo
          } > notes.md
          gh release create "$V" "$EXE" --target "$GITHUB_SHA" --title "Iris Notch $V" --notes-file notes.md $PRE || \
          gh release upload "$V" "$EXE" --clobber

  # winget: propone a Microsoft la scheda della nuova versione (winget install VarietyProject.IrisNotch).
  # Serve: repo pubblico, una prima versione già accettata su microsoft/winget-pkgs, un fork di winget-pkgs
  # sullo stesso account e il segreto WINGET_TOKEN (token classico con public_repo e workflow).
  winget:
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.event.repository.visibility == 'public'
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Versione
        id: v
        if: env.WINGET_TOKEN != ''
        shell: bash
        run: |
          V=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/$GITHUB_SHA/app/src-tauri/tauri.conf.json" | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - name: Proposta a winget
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: VarietyProject.IrisNotch
          release-tag: ${{ steps.v.outputs.tag }}
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
