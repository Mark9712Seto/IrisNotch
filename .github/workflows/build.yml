name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Pubblica una Release con la versione di tauri.conf.json"
        type: boolean
        default: false

# per pubblicare una versione: si alza il numero in app/src-tauri/tauri.conf.json e Cargo.toml,
# poi si avvia questa build a mano con "release" acceso (oppure si crea il tag, es. v0.2.0):
# l'installer viene allegato a una Release di GitHub.
# L'app controlla solo le Release (non i singoli commit) e avvisa che c'è una versione nuova.
permissions:
  contents: write

jobs:
  # test del lato Rust su Linux, compresa la prova completa contro il finto Hermes
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev cmake clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Test
        run: |
          python3 ../../tools/mock_hermes.py 8642 &
          sleep 1
          MOCK_HERMES=http://127.0.0.1:8642 cargo test -- --include-ignored

  # programma per Windows: installer (.exe NSIS) e programma da solo
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # whisper.cpp + Vulkan crea percorsi molto profondi: con la cartella di default si supera il limite
      # di 260 caratteri di Windows (errore FTK1011). Una cartella dal nome corto lo evita.
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> C:\t
      # whisper.cpp con Vulkan: servono gli header e il compilatore di shader (glslc) del Vulkan SDK
      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Iris-Notch-Windows
          path: |
            C:/t/release/bundle/nsis/*.exe
            C:/t/release/iris-volto.exe
          if-no-files-found: error
      - name: Release (solo per i tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: C:/t/release/bundle/nsis/*.exe
          generate_release_notes: true
      - name: Release (avviata a mano)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          gh release create "$V" C:/t/release/bundle/nsis/*.exe --target "$GITHUB_SHA" --title "Iris Notch $V" --generate-notes || \
          gh release upload "$V" C:/t/release/bundle/nsis/*.exe --clobber
